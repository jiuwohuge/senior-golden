info:
  build:
    artifact: "@project.artifactId@"
    name: "@project.name@"
    description: "@project.description@"
    version: "@project.version@"
    java-version: "@java.version@"
    encoding: "@project.build.sourceEncoding@"
    environment: ${spring.profiles.active}
    server-port: ${server.port}

spring:
  # WebMvc 相关：Boot 仍会读取；实际请求级 Locale 以已注册的 LocaleResolver 为准。
  # 当前 commons-web 为 AcceptHeaderLocaleResolver + 默认 ENGLISH 时，无 Accept-Language 回退英语。
  web:
    locale-resolver: accept_header
    locale: zh_CN
  messages:
    basename: messages/app
    encoding: UTF-8
    fallback-to-system-locale: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  main:
    allow-bean-definition-overriding: true
    allow-circular-references: true
  profiles:
    active: local
  ai:
    # 无凭证时保持 none，避免空 key 启动失败；本地有 key 时在 application-local 设为 deepseek
    model:
      chat: ${SPRING_AI_MODEL_CHAT:none}
    deepseek:
      api-key: ${SPRING_AI_DEEPSEEK_API_KEY:}
      base-url: ${SPRING_AI_DEEPSEEK_BASE_URL:https://api.deepseek.com}
      chat:
        options:
          model: ${SPRING_AI_DEEPSEEK_MODEL:deepseek-v4-flash}
          temperature: 0.7
  application:
    name: ${info.build.name}-${spring.profiles.active}
  jackson:
    date-format: "yyyy-MM-dd HH:mm:ss"
    locale: zh_CN
    time-zone: "GMT+8"
  mvc:
    converters:
      preferred-json-mapper: jackson

server:
  servlet:
    context-path: ${SERVER_SERVLET_CONTEXT_PATH:/backend}
  tomcat:
    threads:
      max: 200
      min-spare: 10
  forward-headers-strategy: framework

senior-post:
  auth:
    password-reset-pepper: ${PASSWORD_RESET_PEPPER:senior-post-local-pepper}
  oauth:
    google:
      client-id: ${GOOGLE_WEB_CLIENT_ID:}
  mail:
    # 配置 spring.mail.host 后发送真实邮件；未配置时验证码仅写入服务端日志（WARN）
    from: ${SENIOR_POST_MAIL_FROM:}
    outbox:
      poll-delay-ms: 10000
      batch-size: 20
      max-attempts: 8
      initial-backoff-seconds: 30
  # 阿里云 OSS：未配置完整四项时 /api/oss/put-sign 返回业务错误提示
  oss:
    endpoint: ${ALIYUN_OSS_ENDPOINT:}
    access-key-id: ${ALIYUN_OSS_ACCESS_KEY_ID:}
    access-key-secret: ${ALIYUN_OSS_ACCESS_KEY_SECRET:}
    bucket-name: ${ALIYUN_OSS_BUCKET:}
    put-expire-seconds: 900
    get-expire-seconds: 900
    key-prefix: app/uploads
    public-read-base-url: ${ALIYUN_OSS_PUBLIC_BASE_URL:}
  moderation:
    pending-retry-minutes: 5
    retry-fixed-delay-ms: 120000
    baidu:
      app-id: ${MODERATION_BAIDU_APP_ID:}
      api-key: ${MODERATION_BAIDU_API_KEY:}
      api-secret: ${MODERATION_BAIDU_API_SECRET:}
      connection-timeout-ms: 10000
      socket-timeout-ms: 60000
    deepseek:
      # 文本机审：凭证与模型以 spring.ai.deepseek 为准（SPRING_AI_DEEPSEEK_*）
      # 有 key 时请同时设置 SPRING_AI_MODEL_CHAT=deepseek
      api-key: ${SPRING_AI_DEEPSEEK_API_KEY:}
      base-url: ${SPRING_AI_DEEPSEEK_BASE_URL:https://api.deepseek.com}
      model: ${SPRING_AI_DEEPSEEK_MODEL:deepseek-v4-flash}
      connect-timeout-ms: 10000
      read-timeout-ms: 60000
  mailbox:
    # 平邮到期自动送达：定时扫描间隔（毫秒）
    standard-delivery-fixed-delay-ms: 30000
    standard-delivery-batch-size: 200
  time-letter:
    stamp-cost: 1
    max-delivery-years: 2
    daily-create-limit: 5
    recipient-30d-limit: 3
    in-flight-limit: 20
    body-max-length: 1500
    body-soft-hint-length: 800
    cancel-window-hours: 24
    delivery-batch-size: 200
    delivery-fixed-delay-ms: 60000

jh:
  config:
    exclude-interceptor-pattern: [
      "/api/auth/register",
      "/api/auth/register/email-check",
      "/api/auth/login",
      "/api/auth/google",
      "/api/auth/forgot-password",
      "/api/auth/reset-password",
      "/api/auth/login-challenge/send",
      "/api/auth/login-challenge/confirm",
      "/api/bootstrap/init",
      "/api/bootstrap/release-note",
      "/webapi/auth/login",
    ]
    interceptor-pattern: [ "/api/**", "/webapi/**" ]
    converter-json-pattern: [ "/api/**", "/webapi/**", "/error" ]
    exception-level: DEBUG
    converter-json: true
    auth: true
    error-throwable: false
  security:
    debug: false
    key: 8e32de3646dc4c02ae2507511202c7ca
    android-version: 1
    ios-version: 1
    # 需要对返回值加密的接口路径
    resEncryptUris:
      - /api/**
    # 需要对请求参数解密的接口
    reqDecryptUris:
      - /api/**
    # 忽略返回值加密的接口（管理端 /webapp 与 /webapi 明文；App 匿名明文入口）
    resIgnoreEncryptUris:
      - /webapp/**
      - /webapi/**
    # 忽略参数解密的接口
    reqIgnoreDecryptUris:
      - /webapp/**
      - /webapi/**

knife4j:
  enable: true  # 启用 Knife4j 增强（必须，否则仅启用 springdoc 默认 UI）
  production: false  # 非生产模式（生产模式可禁用文档访问）
  # 可选：Basic Auth 配置（如果需要安全访问）
  basic:
    enable: false
    username: admin
    password: 123456
  # 可选：自定义设置（如语言、UI 定制）
  setting:
    language: zh-CN  # 中文界面

springdoc:
  webjars:
    prefix: /webjars  # 明确 webjars 前缀（默认即可）
  swagger-ui:
    doc-expansion: none
  group-configs:
    - group: ADMIN-API
      packages-to-scan: cn.nine.pros.post.biz.controller.admin
      paths-to-match: /**
    - group: APP-API
      packages-to-scan: cn.nine.pros.post.biz.controller.app
      paths-to-match: /**  # 路径匹配（e.g., /api/** 只匹配特定路径）