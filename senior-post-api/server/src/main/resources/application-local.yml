server:
  port: 9011
  forward-headers-strategy: framework
spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://127.0.0.1:65432/senior_post?useunicode=true&useSSL=false&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: postgres
    password: myppost@2026
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password:
      timeout: 30000
      database: 0
      lettuce:
        pool:
          max-active: 200
          max-wait: 3000
          max-idle: 30
          min-idle: 10


logging:
  level:
    cn.nine.pros.post.server.filter.ApiRequestLogFilter: INFO
    org.springframework.cloud.context.named.NamedContextFactory: WARN   # 或 ERROR
    org.springframework.context.support.AbstractApplicationContext: WARN
    org.springframework.beans.factory.support.DefaultSingletonBeanRegistry: WARN
jh:
  config:
    auth: true
    token-auth: true
  security:
    debug: false
    key: 8e32de3646dc4c02ae2507511202c7ca
    resEncryptUris:
      - /api/**
    reqDecryptUris:
      - /api/**
    resIgnoreEncryptUris:
      - /webapi/**
    reqIgnoreDecryptUris:
      - /webapi/**

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml

# 腾讯 IM / 阿里云 OSS / 机审：勿将真实密钥写入本文件并提交公共仓库。
# Docker Compose 须在 senior-post-api.environment 中透传同名变量（见根目录 docker-compose.yml）。
# 推荐在仓库根目录 .env 中设置：
#   TENCENT_IM_SDK_APP_ID、TENCENT_IM_SECRET_KEY、TENCENT_IM_REST_IDENTIFIER
#   ALIYUN_OSS_ENDPOINT、ALIYUN_OSS_ACCESS_KEY_ID、ALIYUN_OSS_ACCESS_KEY_SECRET、
#   ALIYUN_OSS_BUCKET、ALIYUN_OSS_PUBLIC_BASE_URL（可选）
#   MODERATION_BAIDU_APP_ID、MODERATION_BAIDU_API_KEY、MODERATION_BAIDU_API_SECRET
#   MODERATION_DEEPSEEK_API_KEY、MODERATION_DEEPSEEK_BASE_URL、MODERATION_DEEPSEEK_MODEL
#   GOOGLE_WEB_CLIENT_ID、PASSWORD_RESET_PEPPER、SENIOR_POST_MAIL_FROM（可选）
senior-post:
  oauth:
    google:
      client-id: ${GOOGLE_WEB_CLIENT_ID:}
  auth:
    password-reset-pepper: ${PASSWORD_RESET_PEPPER:senior-post-local-pepper}
  mail:
    from: ${SENIOR_POST_MAIL_FROM:}
  moderation:
    pending-retry-minutes: 5
    retry-fixed-delay-ms: 120000
    baidu:
      app-id: ${MODERATION_BAIDU_APP_ID:}
      api-key: ${MODERATION_BAIDU_API_KEY:}
      api-secret: ${MODERATION_BAIDU_API_SECRET:}
      connection-timeout-ms: 10000
      socket-timeout-ms: 60000
    deepseek:
      # api-key 非空时装配 DeepSeekTextModerationProvider；空则 NoOp
      api-key: ${MODERATION_DEEPSEEK_API_KEY:}
      base-url: ${MODERATION_DEEPSEEK_BASE_URL:https://api.deepseek.com}
      model: ${MODERATION_DEEPSEEK_MODEL:deepseek-chat}
      connect-timeout-ms: 10000
      read-timeout-ms: 60000