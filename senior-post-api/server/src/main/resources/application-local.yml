server:
  port: 9011
  forward-headers-strategy: framework
spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://127.0.0.1:5432/senior_post1?useunicode=true&useSSL=false&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: postgres
    password: postgres
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password:
      timeout: 30000
      database: 0
      lettuce:
        pool:
          max-active: 200
          max-wait: 3000
          max-idle: 30
          min-idle: 10


logging:
  level:
    cn.nine.pros.post.server.filter.ApiRequestLogFilter: INFO
    org.springframework.cloud.context.named.NamedContextFactory: WARN   # 或 ERROR
    org.springframework.context.support.AbstractApplicationContext: WARN
    org.springframework.beans.factory.support.DefaultSingletonBeanRegistry: WARN
jh:
  config:
    auth: true
    token-auth: true
  security:
    debug: false
    key: 8e32de3646dc4c02ae2507511202c7ca
    resEncryptUris:
      - /api/**
    reqDecryptUris:
      - /api/**
    resIgnoreEncryptUris:
      - /webapi/**
    reqIgnoreDecryptUris:
      - /webapi/**

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml

# 腾讯 IM / 阿里云 OSS：勿将真实密钥写入本文件并提交公共仓库。
# 推荐：在运行前设置环境变量 TENCENT_IM_SDK_APP_ID、TENCENT_IM_SECRET_KEY、
# ALIYUN_OSS_ENDPOINT、ALIYUN_OSS_ACCESS_KEY_ID、ALIYUN_OSS_ACCESS_KEY_SECRET、
# ALIYUN_OSS_BUCKET、ALIYUN_OSS_PUBLIC_BASE_URL（可选，用于拼接读 URL）。
# application.yml 中已用 ${...} 占位，此处无需重复声明即可被 Spring 解析。