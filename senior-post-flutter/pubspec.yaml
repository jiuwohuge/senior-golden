name: senior_post_flutter
description: Senior Post — 欧美邮政社交 App（Flutter 客户端）
publish_to: "none"

version: 1.0.0+1

# Dart：兼容本机 Flutter 3.35.x（Dart 3.9）与团队目标 Flutter 3.41.x（Dart 3.10+）
environment:
  sdk: ">=3.9.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  dio: ^5.7.0
  flutter_riverpod: ^2.6.1
  flutter_secure_storage: ^9.2.2
  go_router: ^14.6.2
  intl: ^0.20.2
  tencent_cloud_chat_sdk: 8.8.7373

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  generate: true
