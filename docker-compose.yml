services:
  nginx:
    image: nginx:alpine
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - "${NGINX_CONFIG_DIR:-D:/06_docker_workplace/nginx/conf.d}:/etc/nginx/conf.d/"
      - "D:/06_docker_workplace/nginx/html:/usr/share/nginx/html"
    depends_on:
      - senior-post-manage
      - senior-post-api

  postgresql:
    image: bitnami/postgresql:latest
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRESQL_DATABASE: ${POSTGRES_DB:-senior_post}
      POSTGRESQL_USERNAME: ${POSTGRES_USER:-postgres}
      POSTGRESQL_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - "${POSTGRES_DATA_DIR:-D:/06_docker_workplace/postgresql}:/bitnami/postgresql"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-senior_post}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:latest
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - "${REDIS_DATA_DIR:-D:/06_docker_workplace/redis-data}:/data"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  senior-post-api:
    image: senior-post-api:local
    build:
      context: ./senior-post-api
      dockerfile: Dockerfile
      args:
        JAR_FILE: server/target/senior-post-server-*.jar
    ports:
      - "9011:9011"
      - "5005:5005"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      SERVER_SERVLET_CONTEXT_PATH: ${SERVER_SERVLET_CONTEXT_PATH:-/backend}
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:postgresql://postgresql:5432/senior_post?useunicode=true&useSSL=false&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-postgres}
      SPRING_DATA_REDIS_HOST: ${SPRING_DATA_REDIS_HOST:-redis}
      SPRING_DATA_REDIS_PORT: ${SPRING_DATA_REDIS_PORT:-6379}
      SPRING_DATA_REDIS_PASSWORD: ${SPRING_DATA_REDIS_PASSWORD:-}
      JAVA_OPTS: ${JAVA_OPTS:--Xms256m -Xmx512m}
      TENCENT_IM_SDK_APP_ID: ${TENCENT_IM_SDK_APP_ID:-0}
      TENCENT_IM_SECRET_KEY: ${TENCENT_IM_SECRET_KEY:-}
      ALIYUN_OSS_ENDPOINT: ${ALIYUN_OSS_ENDPOINT:-}
      ALIYUN_OSS_ACCESS_KEY_ID: ${ALIYUN_OSS_ACCESS_KEY_ID:-}
      ALIYUN_OSS_ACCESS_KEY_SECRET: ${ALIYUN_OSS_ACCESS_KEY_SECRET:-}
      ALIYUN_OSS_BUCKET: ${ALIYUN_OSS_BUCKET:-}
      ALIYUN_OSS_PUBLIC_BASE_URL: ${ALIYUN_OSS_PUBLIC_BASE_URL:-}
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy

  senior-post-manage:
    image: node:20
    working_dir: /app
    command:
      [
        "sh",
        "-c",
        "if [ ! -x node_modules/.bin/vite ]; then npm install --include=optional; fi && npm run dev -- --host 0.0.0.0 --port 5174",
      ]
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:${NGINX_PORT:-80}}
      VITE_BASE_PATH: ${VITE_BASE_PATH:-/manage/}
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    volumes:
      - ./senior-post-manage:/app
      - manage_node_modules:/app/node_modules
    ports:
      - "8080:5174"
    depends_on:
      - senior-post-api

volumes:
  manage_node_modules:
